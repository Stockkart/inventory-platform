name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commits PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            style
            docs
            test
            chore
            ci
            revert
          requireScope: false
          # Examples: feat(product): ..., fix(shell): ...
          subjectPattern: ^.+$
          subjectPatternError: |
            The PR title "{title}" looks incomplete after the type.
            Use: feat(product): short description
          ignoreLabels: |
            do-not-merge
