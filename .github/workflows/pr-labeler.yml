name: PR Labeler

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  path-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Apply path-based labels
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  size-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Label PR by diff size
        uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size:XS'
          xs_max_size: '50'
          s_label: 'size:S'
          s_max_size: '200'
          m_label: 'size:M'
          m_max_size: '600'
          l_label: 'size:L'
          l_max_size: '1200'
          xl_label: 'size:XL'
          fail_if_xl: 'false'
          message_if_xl: >
            This PR is very large. Prefer splitting by domain (core/*, platform/*, ui-kit, plugins)
            so review stays focused.
          files_to_ignore: |
            pnpm-lock.yaml
            **/*.lock
            **/dist/**
