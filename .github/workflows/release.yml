# Release: every push to main → test → staging → verify → production → verify.
# No human step after the merge. See docs/deploying.md.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.8.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test, build, typecheck
        run: |
          pnpm exec nx run-many -t test build --all
          pnpm exec nx run-many -t typecheck --all

  deploy-staging:
    name: Staging
    needs: test
    uses: ./.github/workflows/_deploy.yml
    with:
      sha: ${{ github.sha }}
      environment: staging
    secrets: inherit

  deploy-production:
    name: Production
    needs: deploy-staging
    uses: ./.github/workflows/_deploy.yml
    with:
      sha: ${{ github.sha }}
      environment: production
    secrets: inherit
