# Path → label mapping for pull requests.
# Applied by .github/workflows/pr-labeler.yml (actions/labeler).
# Label definitions live in .github/labels.yml (synced on main).

'area:app':
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/**'

'area:ui-kit':
  - changed-files:
      - any-glob-to-any-file:
          - 'ui-kit/**'

'area:platform':
  - changed-files:
      - any-glob-to-any-file:
          - 'platform/**'

'area:core':
  - changed-files:
      - any-glob-to-any-file:
          - 'core/**'

'area:plugins':
  - changed-files:
      - any-glob-to-any-file:
          - 'plugins/**'

'area:ci':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'nx.json'
          - 'eslint.config.mjs'
          - 'pnpm-workspace.yaml'
          - 'tsconfig*.json'

'area:docs':
  - changed-files:
      - any-glob-to-any-file:
          - '**/README.md'
          - 'CONTRIBUTING.md'
          - 'docs/**'

