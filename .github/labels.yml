# Canonical GitHub labels — synced by .github/workflows/sync-labels.yml
# Colors are hex without '#'. Keep them saturated so PR sidebars stay readable.

# ── Areas (layer) ──────────────────────────────────────────────
- name: area:app
  color: '7C3AED'
  description: apps/inventory changes
- name: area:ui-kit
  color: 'EC4899'
  description: Design system / ui-kit
- name: area:platform
  color: '0EA5E9'
  description: platform/* infra
- name: area:core
  color: '22C55E'
  description: core/* domain packages
- name: area:plugins
  color: 'F97316'
  description: plugins/* verticals
- name: area:ci
  color: 'EAB308'
  description: CI, GitHub Actions, tooling
- name: area:docs
  color: '6366F1'
  description: README / docs only

