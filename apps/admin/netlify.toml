# Netlify site config for the StockKart admin app (apps/admin), a separate site
# from the shop app (apps/inventory/netlify.toml).
#
# Netlify UI settings this file expects:
#   Base directory:    (empty — repo root, where pnpm-lock.yaml lives)
#   Package directory: apps/admin   (UI-only setting; this file lives here)
#   Environment:       VITE_API_URL = the API base, e.g. https://<api-host>/api/v1
#
# The admin app is a static single-page app (react-router.config.ts: ssr false),
# so there is no server function: Netlify serves build/client and sends every
# path to index.html, where the client router takes over.
#
# The API must allow this site's origin: set the API's ADMIN_CLIENT_URL to the
# admin site URL (see docs/deploying.md, "Admin app").

[build]
  # COMMIT_REF is set by Netlify; it renders <meta name="build-sha"> so the live
  # commit can be checked, as on the shop app.
  command = "VITE_BUILD_SHA=$COMMIT_REF pnpm nx build admin-app"
  publish = "apps/admin/build/client"

[build.environment]
  # Same toolchain as the shop app site.
  NODE_VERSION = "20"
  PNPM_VERSION = "9.8.0"
  NX_DAEMON = "false"

# Single-page app fallback: any path that is not a built file opens the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Content-hashed files never change at a given URL (see apps/inventory/netlify.toml).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Staff-only tool: keep it out of search engines and out of frames.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
