// Local Expo Module (Expo SDK 55, Expo Modules API). Picked up by expo-modules-autolinking from
// apps/attendance/modules during `expo prebuild` / `eas build`; never built by Nx.
apply plugin: 'com.android.library'

group = 'expo.modules.biometricsigner'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// Take compileSdk / minSdk / targetSdk from the app (expo-build-properties sets minSdkVersion 28
// in app.json; the Keystore APIs used here need API 28 and the module checks Build.VERSION for the
// API 30 split).
buildscript {
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }
}
project.android {
  compileSdkVersion safeExtGet("compileSdkVersion", 36)
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 28)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
  }
}

android {
  namespace "expo.modules.biometricsigner"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // BiometricPrompt / BiometricManager with BIOMETRIC_STRONG and CryptoObject (R5.2, DD4).
  implementation "androidx.biometric:biometric:1.1.0"
  // FragmentActivity (BiometricPrompt's host) and ContextCompat.getMainExecutor.
  implementation "androidx.fragment:fragment:1.6.2"
  implementation "androidx.core:core:1.13.1"
}
